# Configuration Robocop (lint Robot Framework) : utilisée en local et par la
# CI (.github/workflows/ci.yml). Les écarts acceptés découlent des conventions
# du dépôt (CLAUDE.md) :
#
# - todo-in-comment (COM01) : le marqueur TODO est la convention 5 (locator à
#   relever sur le SUT) : c'est un état voulu, pas un oubli.
# - line-too-long porté à 180 : un locator et son commentaire « # relevé SUT
#   <date> » restent sur UNE ligne (lisibilité des page objects).
# - inline-if-can-be-used (MISC09) : IF multi-lignes accepté (lisibilité).
# - too-many-calls-in-keyword (LEN03) : un keyword d'écran qui enchaîne
#   plusieurs interactions (formulaire à N champs) est légitime.

[lint]
ignore = [
    "todo-in-comment",
    "inline-if-can-be-used",
    "too-many-calls-in-keyword",
]
configure = [
    "line-too-long.line_length=180",
]
